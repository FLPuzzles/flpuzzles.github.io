const status=document.getElementById('status'),bounds=[];
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function destination(h){return `${h.street}, ${h.city}, ${h.state} ${h.originalZip}`;}
function mapUrl(address){return /iPhone|iPad|iPod|Macintosh/i.test(navigator.userAgent)?'https://maps.apple.com/?q='+encodeURIComponent(address):'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(address);}
function addMarker(h,lat,lon){const icon=L.divIcon({className:'leaflet-div-icon',html:`<div class="number-marker" style="background:${h.color};border-color:${h.color}">${h.n}</div>`,iconSize:[33,33],iconAnchor:[16,16],popupAnchor:[0,-15]});L.marker([lat,lon],{icon}).addTo(map).bindPopup(`<strong>Sale ${esc(h.n)}</strong><br><span style="color:${h.color};font-weight:750">${esc(h.region)}</span><br>${esc(h.street)}<br>${esc(h.city)}, ${esc(h.state)} ${esc(h.originalZip)}<br><a class="maplink" target="_blank" rel="noopener" href="${mapUrl(destination(h))}">Open in Maps</a>`);bounds.push([lat,lon]);map.fitBounds(bounds,{padding:[48,48],maxZoom:16});}
function jsonpCensus(h){return new Promise(resolve=>{const callback='dcvGeo'+homes.indexOf(h)+'_'+Date.now();const script=document.createElement('script');let finished=false;const finish=(value)=>{if(finished)return;finished=true;clearTimeout(timer);script.remove();delete window[callback];resolve(value)};const timer=setTimeout(()=>finish(null),9500);window[callback]=(data)=>{const matches=data?.result?.addressMatches||[];const match=matches.find(m=>{const a=(m.matchedAddress||'').toUpperCase();return a.includes('ORLANDO')&&a.includes('FL')&&a.includes(h.street.split(' ')[0]);});const x=match ? Number(match.coordinates?.x) : NaN,y=match ? Number(match.coordinates?.y) : NaN;finish(Number.isFinite(x)&&Number.isFinite(y)&&y>28.3&&y<28.5&&x>-81.6&&x<-81.3?[y,x]:null)};script.onerror=()=>finish(null);script.src='https://geocoding.geo.census.gov/geocoder/geographies/address?street='+encodeURIComponent(h.street)+'&city='+encodeURIComponent(h.city)+'&state='+encodeURIComponent(h.state)+'&zip='+encodeURIComponent(h.originalZip)+'&benchmark=Public_AR_Current&vintage=Current_Current&format=jsonp&callback='+callback;document.head.appendChild(script);});}
async function osmLookup(h){try{const u='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q='+encodeURIComponent(destination(h));const r=await fetch(u,{headers:{'Accept':'application/json'}});if(!r.ok)return null;const j=await r.json();if(!j.length)return null;const lat=Number(j[0].lat),lon=Number(j[0].lon);return lat>28.3&&lat<28.5&&lon> -81.6&&lon< -81.3?[lat,lon]:null;}catch{return null}}
(async()=>{let placed=0,missing=[];for(const h of homes){let point=null;try{const cached=JSON.parse(localStorage.getItem('dcv-sale-2026-rev5:'+destination(h)));if(Array.isArray(cached)&&cached.length===2&&cached[0]>28.3&&cached[0]<28.5&&cached[1]>-81.6&&cached[1]<-81.3)point=cached;}catch{}if(!point)point=await jsonpCensus(h);if(!point)point=await osmLookup(h);if(point){addMarker(h,...point);placed++;try{localStorage.setItem('dcv-sale-2026-rev5:'+destination(h),JSON.stringify(point));}catch{}}else missing.push(h);status.textContent=`Mapped ${placed} of ${homes.length} participating homes…`;}
if(missing.length){const box=document.createElement("div");box.className="unmapped";box.innerHTML="<strong>Address not located automatically:</strong> "+missing.map(h=>{return `<a target="_blank" rel="noopener" href="${mapUrl(destination(h))}">#${n} — ${esc(h.street)} (Open in Maps)</a>`}).join(" · ");document.body.appendChild(box);status.textContent=`${placed} of ${homes.length} homes mapped. Unable to locate sale #${missing.map(h=>h.n).join(', ')}.`;status.style.background='#fff8e7';}else{status.textContent=`${placed} participating homes · Tap a number for directions`;setTimeout(()=>status.remove(),6500);}})();
