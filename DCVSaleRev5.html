.list-panel.open{display:flex}.list-head{padding:17px 18px 12px;border-bottom:1px solid #ddd;display:flex;align-items:start;gap:12px;justify-content:space-between}.list-head h2{font-size:21px;margin:0 0 5px}.list-head p{margin:0;color:#526053;font-size:14px}.close-list{border:0;background:#eee;border-radius:8px;font-size:25px;min-width:42px;min-height:42px;cursor:pointer}.list-scroll{overflow-y:auto;overscroll-behavior:contain;padding:12px 16px 24px;flex:1}.region-heading{font-size:16px;color:#25372b;margin:18px 0 7px;border-bottom:1px solid #ddd;padding-bottom:6px}.home-row{display:flex;gap:12px;align-items:center;padding:12px 8px;border-bottom:1px solid #eee;cursor:pointer;border-radius:6px}.home-row input{width:24px;height:24px;accent-color:#267043;flex:none;cursor:pointer}.home-row .home-text{flex:1;min-width:0}.home-row .home-label{font-weight:800;display:inline-block;margin-right:7px}.home-row .home-address{font-size:14px;color:#4c554d;display:block;margin-top:3px}.home-row.checked .home-text{opacity:.55}.home-row.checked .home-address{text-decoration:line-through}.list-footer{padding:12px 16px;border-top:1px solid #ddd;background:#f8faf8;font-size:13px;color:#526053}.map-marker-visited{opacity:.48;filter:grayscale(.4)}

o","state":"FL","zip":"32821","lat":28.39101212871735,"lng":-81.44204611665788},{"label":"C2","region":"Central","color":"#7941A5","street":"12238 Dickenson Ln","city":"Orlando","state":"FL","zip":"32821","lat":28.39155853871354,"lng":-81.4428590330127},{"label":"C3","region":"Central","color":"#7941A5","street":"5356 Dorrington Ln","city":"Orlando","state":"FL","zip":"32821","lat":28.393019649783575,"lng":-81.4445722111266},{"label":"C4","region":"Central","color":"#7941A5","street":"5331 Dorrington Ln","city":"Orlando","state":"FL","zip":"32821","lat":28.39322307618053,"lng":-81.4437115529771},{"label":"C5","region":"Central","color":"#7941A5","street":"5226 Dorrington Ln","city":"Orlando","state":"FL","zip":"32821","lat":28.39324937339568,"lng":-81.44194600052924},{"label":"C6","region":"Central","color":"#7941A5","street":"5118 Dorrington","city":"Orlando","state":"FL","zip":"32821","lat":28.393996276821476,"lng":-81.44059797432887},{"label":"C7","region":"Central","color":"#7941A5","street":"5007 Demott Ct","city":"Orlando","state":"FL","zip":"32821","lat":28.39433991387712,"lng":-81.43805626363327}];
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function destination(h){return `${h.street}, ${h.city}, ${h.state} ${h.zip}`;}
function mapUrl(h){const a=encodeURIComponent(destination(h));return /iPhone|iPad|iPod|Macintosh/i.test(navigator.userAgent)?`https://maps.apple.com/?q=${a}`:`https://www.google.com/maps/search/?api=1&query=${a}`;}

else {
 window.saleMap=L.map('map',{zoomControl:true});
 const map=window.saleMap;

  markerByAddress.set(destination(h).toLowerCase(),marker);
  window.saleMarkers.set(destination(h).toLowerCase(),marker);
  bounds.push([h.lat,h.lng]);
 }

<script>
/* Checklist works independently of the map library. Each address is its own key. */
(function(){
 'use strict';
 const button=document.getElementById('visitButton');
 const panel=document.getElementById('visitPanel');
 const scrim=document.getElementById('listScrim');
 const close=document.getElementById('closeList');
 const list=document.getElementById('visitList');
 const count=document.getElementById('visitCount');
 const progress=document.getElementById('progressText');
 const storageKey='dcvGarageSale2026VisitedV1';
 let saved={};
 try { const parsed=JSON.parse(localStorage.getItem(storageKey)||'{}'); if(parsed && typeof parsed==='object' && !Array.isArray(parsed)) saved=parsed; } catch(e) { /* private browsing or disabled storage */ }
 const key=h=>destination(h).toLowerCase();
 function persist(){try{localStorage.setItem(storageKey,JSON.stringify(saved));}catch(e){}}
 function update(){
   const visited=homes.filter(h=>saved[key(h)]).length;
   count.textContent=visited+'/'+homes.length;
   progress.textContent=visited+' of '+homes.length+' visited';
   document.querySelectorAll('.home-row').forEach(row=>{
     const checked=!!saved[row.dataset.key];
     row.classList.toggle('checked',checked);
     row.querySelector('input').checked=checked;
   });
   if(window.saleMarkers){homes.forEach(h=>{
     const marker=window.saleMarkers.get(key(h));
     if(marker && marker.getElement()) marker.getElement().classList.toggle('map-marker-visited',!!saved[key(h)]);
   });}
 }
 const regions=['North','Central','West'];
 for(const region of regions){
   const heading=document.createElement('h3');heading.className='region-heading';heading.textContent=region;
   list.appendChild(heading);
   homes.filter(h=>h.region===region).sort((a,b)=>a.label.localeCompare(b.label,undefined,{numeric:true}) || a.street.localeCompare(b.street)).forEach(h=>{
     const row=document.createElement('label');row.className='home-row';row.dataset.key=key(h);
     const input=document.createElement('input');input.type='checkbox';input.setAttribute('aria-label','Visited '+h.label+', '+destination(h));
     const info=document.createElement('span');info.className='home-text';
     const badge=document.createElement('span');badge.className='home-label';badge.textContent=h.label;badge.style.color=h.color;
     const addr=document.createElement('span');addr.className='home-address';addr.textContent=destination(h);
     info.append(badge,addr);row.append(input,info);list.appendChild(row);
     input.addEventListener('change',()=>{saved[key(h)]=input.checked;persist();update();});
   });
 }
 function open(){panel.classList.add('open');scrim.classList.add('open');panel.setAttribute('aria-hidden','false');button.setAttribute('aria-expanded','true');document.body.style.overflow='hidden';close.focus();}
 function shut(){panel.classList.remove('open');scrim.classList.remove('open');panel.setAttribute('aria-hidden','true');button.setAttribute('aria-expanded','false');document.body.style.overflow='';button.focus();}
 button.addEventListener('click',open);close.addEventListener('click',shut);scrim.addEventListener('click',shut);
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&panel.classList.contains('open'))shut();});
 update();
 if(window.saleMap)window.saleMap.on('zoomend moveend',update);
})();
</script></body></html>
