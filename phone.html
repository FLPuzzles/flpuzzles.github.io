<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Central Florida Puzzle Swap Locations</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --ink: #222;
      --muted: #555;
      --panel: #fff;
      --border: #2d2d2d;
      --shadow: 0 8px 28px rgba(0,0,0,.22);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: #eef2f3;
    }

    #map {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    .map-title {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 700;
      background: rgba(255,255,255,.96);
      border: 1.5px solid rgba(35,35,35,.8);
      border-radius: 11px;
      padding: 9px 13px 8px;
      box-shadow: 0 3px 14px rgba(0,0,0,.16);
      text-align: center;
      width: min(300px, calc(100vw - 110px));
      pointer-events: none;
    }
    .map-title strong {
      display: block;
      font-size: 16px;
      line-height: 1.15;
    }
    .map-title span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    .locations-button {
      position: fixed;
      z-index: 750;
      left: 50%;
      transform: translateX(-50%);
      bottom: max(18px, calc(env(safe-area-inset-bottom) + 10px));
      border: 2px solid var(--border);
      border-radius: 999px;
      background: #fff;
      color: #222;
      box-shadow: var(--shadow);
      padding: 12px 19px;
      font-size: 16px;
      font-weight: 750;
      line-height: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .locations-button:active { transform: translateX(-50%) scale(.98); }

    .scrim {
      position: fixed;
      inset: 0;
      z-index: 800;
      background: rgba(0,0,0,.23);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    .scrim.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      position: fixed;
      z-index: 850;
      left: 0;
      right: 0;
      bottom: 0;
      height: min(82vh, 760px);
      background: var(--panel);
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -8px 30px rgba(0,0,0,.24);
      transform: translateY(105%);
      transition: transform .24s ease;
      display: flex;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .sheet.open { transform: translateY(0); }

    .sheet-header {
      position: relative;
      flex: 0 0 auto;
      padding: 17px 56px 12px 18px;
      border-bottom: 1px solid #ddd;
    }
    .grabber {
      position: absolute;
      top: 7px;
      left: 50%;
      transform: translateX(-50%);
      width: 42px;
      height: 5px;
      border-radius: 999px;
      background: #c7c7c7;
    }
    .sheet-header h1 {
      margin: 6px 0 2px;
      font-size: 21px;
      line-height: 1.15;
    }
    .sheet-header p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }
    .close-button {
      position: absolute;
      right: 13px;
      top: 17px;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: #efefef;
      color: #222;
      font-size: 25px;
      line-height: 33px;
      cursor: pointer;
    }

    .list {
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 7px 13px 18px;
    }
    .location {
      padding: 10px 7px 11px;
      border-bottom: 1px solid #e7e7e7;
      cursor: pointer;
      -webkit-tap-highlight-color: rgba(0,0,0,.05);
    }
    .location:last-child { border-bottom: 0; }
    .location-line {
      font-size: 16px;
      line-height: 1.25;
    }
    .location-line strong { font-weight: 800; }
    .address {
      margin-top: 2px;
      color: #3e3e3e;
      font-size: 15px;
      line-height: 1.25;
    }

    .number-marker {
      background: #fff;
      border: 2px solid #222;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
      color: #111;
      box-shadow: 0 1px 4px rgba(0,0,0,.35);
    }
    .leaflet-div-icon {
      background: transparent;
      border: none;
    }
    .leaflet-popup-content {
      margin: 11px 13px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.3;
    }
    .leaflet-control-attribution { font-size: 9px; }

    /* On larger screens this testing file still stays map-first,
       but gives the button a little more breathing room. */
    @media (min-width: 700px) {
      .map-title {
        width: auto;
        min-width: 280px;
      }
      .sheet {
        left: auto;
        right: 18px;
        bottom: 18px;
        width: 390px;
        height: calc(100vh - 36px);
        border-radius: 14px;
      }
      .locations-button {
        left: auto;
        right: 22px;
        transform: none;
      }
      .locations-button:active { transform: scale(.98); }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="map-title">
    <strong>Central Florida Swap Locations</strong>
    <span>Tap a number for location details</span>
  </div>

  <button id="locationsButton" class="locations-button" type="button" aria-controls="locationSheet" aria-expanded="false">
    ☰ &nbsp;View Locations
  </button>

  <div id="scrim" class="scrim"></div>

  <section id="locationSheet" class="sheet" aria-hidden="true">
    <div class="sheet-header">
      <div class="grabber"></div>
      <h1>Swap Locations</h1>
      <p>Tap a location to find it on the map.</p>
      <button id="closeButton" class="close-button" type="button" aria-label="Close locations">×</button>
    </div>
    <div id="locationList" class="list"></div>
  </section>

  <script>
    const locations = [{"n": 1, "city": "Casselberry", "venue": "Seminole County Library", "address": "215 N Oxford Rd, Casselberry, FL 32707", "lat": 28.6686, "lng": -81.3264}, {"n": 2, "city": "Chickasaw", "venue": "Chickasaw Library", "address": "870 N Chickasaw Trail, Chickasaw, FL 32825", "lat": 28.5584, "lng": -81.273}, {"n": 3, "city": "Dr. Phillips", "venue": "Southwest Library", "address": "7255 Della Dr, Dr. Phillips, FL 32819", "lat": 28.455, "lng": -81.491}, {"n": 4, "city": "East Orlando", "venue": "Alafaya Library", "address": "12000 E Colonial Dr, East Orlando, FL 32826", "lat": 28.5675, "lng": -81.2075}, {"n": 5, "city": "Maitland", "venue": "Maitland Library", "address": "501 Maitland Ave, Maitland, FL 32751", "lat": 28.6294, "lng": -81.3656}, {"n": 6, "city": "Ocoee", "venue": "West Oaks Library", "address": "1821 E Silver Star Rd, Ocoee, FL 34761", "lat": 28.5744, "lng": -81.543}, {"n": 7, "city": "South Orlando", "venue": "South Creek Library", "address": "1702 Deerfield Blvd, South Orlando, FL 32837", "lat": 28.3821, "lng": -81.4058}, {"n": 8, "city": "Winter Garden", "venue": "Winter Garden Library", "address": "805 E Plant St, Winter Garden, FL 34787", "lat": 28.5653, "lng": -81.5805}, {"n": 9, "city": "West Orlando", "venue": "St. Luke's Church", "address": "4851 S Apopka Vineland Rd, West Orlando, FL 32819", "lat": 28.489, "lng": -81.506}, {"n": 10, "city": "Belleview", "venue": "Marion County Library", "address": "13145 SE County Hwy 484, Belleview, FL 34420", "lat": 29.0553, "lng": -82.062}, {"n": 11, "city": "DeLand", "venue": "DeLand Library", "address": "130 East Howry Ave, DeLand, FL 32724", "lat": 29.026, "lng": -81.303}, {"n": 12, "city": "Gainesville", "venue": "Meizon Church", "address": "3411 NW 83rd St, Gainesville, FL 32606", "lat": 29.685, "lng": -82.431}, {"n": 13, "city": "Lake Mary", "venue": "North West Library", "address": "580 Green Way Blvd, Lake Mary, FL 32746", "lat": 28.76, "lng": -81.3548}, {"n": 14, "city": "Mount Dora", "venue": "W.T. Bland Library", "address": "1995 N Donnelly St, Mount Dora, FL 32757", "lat": 28.819, "lng": -81.647}, {"n": 15, "city": "Ocala", "venue": "Silver Springs Rec Center", "address": "590 Silver Rd, Ocala, FL 34472", "lat": 29.118, "lng": -82.03}, {"n": 16, "city": "Port Orange", "venue": "Elks Club #2723", "address": "5207 S Ridgewood Ave, Port Orange, FL 32127", "lat": 29.12, "lng": -80.984}, {"n": 17, "city": "Avon Park", "venue": "American Legion Post 69", "address": "1301 W Bell St, Avon Park, FL 33825", "lat": 27.6, "lng": -81.52}, {"n": 18, "city": "Bartow", "venue": "Bartow Library", "address": "2150 S Broadway Ave, Bartow, FL 33830", "lat": 27.88, "lng": -81.843}, {"n": 19, "city": "Beverly Hills", "venue": "Central Ridge Library", "address": "425 West Roosevelt Blvd, Beverly Hills, FL 34465", "lat": 28.916, "lng": -82.459}, {"n": 20, "city": "Clermont", "venue": "Cagan Crossings Library", "address": "16729 Cagan Oaks, Clermont, FL 34714", "lat": 28.347, "lng": -81.676}, {"n": 21, "city": "Cocoa", "venue": "Catherine S. Rood Library", "address": "308 Forrest Ave, Cocoa, FL 32922", "lat": 28.355, "lng": -80.727}, {"n": 22, "city": "Dundee", "venue": "Dundee Library", "address": "202 E Main St, Dundee, FL 33838", "lat": 28.022, "lng": -81.62}, {"n": 23, "city": "Kissimmee", "venue": "Hart Memorial Library", "address": "211 E Dakin Ave, Kissimmee, FL 34741", "lat": 28.292, "lng": -81.404}, {"n": 24, "city": "Seffner", "venue": "Seffner-Mango Library", "address": "410 Kingsway Rd, Seffner, FL 33584", "lat": 27.998, "lng": -82.276}, {"n": 25, "city": "Tampa", "venue": "New Tampa Regional Library", "address": "10001 Cross Creek Blvd, Tampa, FL 33647", "lat": 28.1435, "lng": -82.328}, {"n": 26, "city": "Tarpon Springs", "venue": "Consignment Emporium", "address": "9 S Safford Ave, Tarpon Springs, FL 34689", "lat": 28.146, "lng": -82.757}, {"n": 27, "city": "Thonotosassa", "venue": "Thonotosassa Library", "address": "10715 Main St, Thonotosassa, FL 33592", "lat": 28.062, "lng": -82.296}, {"n": 28, "city": "Wesley Chapel", "venue": "New River Library", "address": "34043 FL-54, Wesley Chapel, FL 33543", "lat": 28.238, "lng": -82.252}, {"n": 29, "city": "West Tampa", "venue": "Town 'N Country Library", "address": "7606 Paula Dr, West Tampa, FL 33615", "lat": 28.01, "lng": -82.565}, {"n": 30, "city": "Melbourne", "venue": "Suntree-Viera Library", "address": "902 Jordan Blass Rd, Melbourne, FL 32940", "lat": 28.229, "lng": -80.698}, {"n": 31, "city": "Lake Wales", "venue": "Lake Wales Library", "address": "290 Cypress Garden Ln, Lake Wales, FL 33853", "lat": 27.901, "lng": -81.588}, {"n": 32, "city": "Dunnellon", "venue": "Dunnellon Library", "address": "20351 Robinson Rd, Dunnellon, FL 34431", "lat": 29.049, "lng": -82.46}];

    const map = L.map("map", {
      zoomControl: true,
      preferCanvas: false
    });

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const markers = new Map();
    const bounds = [];

    function markerIcon(n) {
      return L.divIcon({
        className: "leaflet-div-icon",
        html: `<div class="number-marker">${n}</div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 15],
        popupAnchor: [0, -13]
      });
    }

    locations.forEach(loc => {
      const popup = `
        <div>
          <strong>${loc.n}. ${loc.city}</strong><br>
          ${loc.venue}<br>
          ${loc.address}
        </div>`;

      const marker = L.marker([loc.lat, loc.lng], { icon: markerIcon(loc.n) })
        .addTo(map)
        .bindPopup(popup, { maxWidth: 280 });

      markers.set(loc.n, marker);
      bounds.push([loc.lat, loc.lng]);
    });

    map.fitBounds(bounds, { padding: [38, 38] });

    const sheet = document.getElementById("locationSheet");
    const scrim = document.getElementById("scrim");
    const locationsButton = document.getElementById("locationsButton");
    const closeButton = document.getElementById("closeButton");
    const list = document.getElementById("locationList");

    locations.forEach(loc => {
      const item = document.createElement("div");
      item.className = "location";
      item.setAttribute("role", "button");
      item.setAttribute("tabindex", "0");
      item.innerHTML = `
        <div class="location-line"><strong>${loc.n}. ${loc.city}</strong> — ${loc.venue}</div>
        <div class="address">${loc.address}</div>
      `;

      const goToLocation = () => {
        closeSheet();
        setTimeout(() => {
          map.setView([loc.lat, loc.lng], Math.max(map.getZoom(), 12), { animate: true });
          markers.get(loc.n).openPopup();
        }, 250);
      };

      item.addEventListener("click", goToLocation);
      item.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          goToLocation();
        }
      });
      list.appendChild(item);
    });

    function openSheet() {
      sheet.classList.add("open");
      scrim.classList.add("open");
      sheet.setAttribute("aria-hidden", "false");
      locationsButton.setAttribute("aria-expanded", "true");
    }

    function closeSheet() {
      sheet.classList.remove("open");
      scrim.classList.remove("open");
      sheet.setAttribute("aria-hidden", "true");
      locationsButton.setAttribute("aria-expanded", "false");
      setTimeout(() => map.invalidateSize(), 260);
    }

    locationsButton.addEventListener("click", openSheet);
    closeButton.addEventListener("click", closeSheet);
    scrim.addEventListener("click", closeSheet);

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeSheet();
    });

    window.addEventListener("resize", () => map.invalidateSize());
  </script>
</body>
</html>
